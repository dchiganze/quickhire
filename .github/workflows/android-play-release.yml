name: Build and submit QuickHire Vendor Mobile to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play release track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      submit:
        description: Upload the completed AAB to Google Play
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: quickhire-android-play-release
  cancel-in-progress: false

env:
  APP_DIR: artifacts/quickhire-vendor-mobile
  ANDROID_PACKAGE: com.quickhirevendormobile

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile --prod=false

      - name: Verify Expo Babel preset
        run: pnpm --filter @workspace/quickhire-vendor-mobile exec node -e "require.resolve('babel-preset-expo')"

      - name: Generate Android native project
        env:
          EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN || 'quick-hire-2.replit.app' }}
        run: pnpm --filter @workspace/quickhire-vendor-mobile exec expo prebuild --platform android --non-interactive --no-install

      - name: Install Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$APP_DIR/android/app/upload-keystore.jks"

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          app_dir = Path(os.environ["APP_DIR"])
          gradle_properties = app_dir / "android" / "gradle.properties"
          with gradle_properties.open("a", encoding="utf-8") as handle:
              handle.write("\n")
              handle.write("MYAPP_UPLOAD_STORE_FILE=upload-keystore.jks\n")
              handle.write(f"MYAPP_UPLOAD_KEY_ALIAS={os.environ['ANDROID_KEY_ALIAS']}\n")
              handle.write(f"MYAPP_UPLOAD_STORE_PASSWORD={os.environ['ANDROID_KEYSTORE_PASSWORD']}\n")
              handle.write(f"MYAPP_UPLOAD_KEY_PASSWORD={os.environ['ANDROID_KEY_PASSWORD']}\n")

          gradle_file = app_dir / "android" / "app" / "build.gradle"
          text = gradle_file.read_text(encoding="utf-8")
          if "signingConfigs.release" not in text:
              marker = "signingConfigs {\n"
              release_config = """signingConfigs {
                  release {
                      storeFile file(MYAPP_UPLOAD_STORE_FILE)
                      storePassword MYAPP_UPLOAD_STORE_PASSWORD
                      keyAlias MYAPP_UPLOAD_KEY_ALIAS
                      keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                  }
          """
              if marker not in text:
                  raise SystemExit("Could not locate Android signing configuration")
              text = text.replace(marker, release_config, 1)
              text, replacements = re.subn(
                  r"(buildTypes\s*\{.*?release\s*\{.*?signingConfig\s+)signingConfigs\.debug",
                  r"\1signingConfigs.release",
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if replacements != 1:
                  raise SystemExit("Could not configure Android release signing")
              gradle_file.write_text(text, encoding="utf-8")
          PY

      - name: Build signed Android App Bundle
        working-directory: artifacts/quickhire-vendor-mobile/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickhire-vendor-mobile-android-release
          path: artifacts/quickhire-vendor-mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Submit Android build to Google Play
        if: ${{ inputs.submit }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE }}
          releaseFiles: artifacts/quickhire-vendor-mobile/android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track }}
          status: completed
