name: Build QuickHire Vendor Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-build:
    name: Typecheck and build iOS + Android bundles
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared API client
        run: pnpm --filter @workspace/api-client-react exec tsc --build

      - name: Typecheck mobile app
        run: pnpm --filter @workspace/quickhire-vendor-mobile run typecheck

      - name: Build iOS and Android Expo bundles
        env:
          EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN || 'quick-hire-2.replit.app' }}
        run: pnpm --filter @workspace/quickhire-vendor-mobile run build

      - name: Upload mobile build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickhire-vendor-mobile-bundles
          path: artifacts/quickhire-vendor-mobile/static-build
          if-no-files-found: error
